name: Build & Release

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag / version, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: write

# Pinned Flutter version. F-Droid extracts this exact value from the recipe so
# its build matches upstream. Defined once here and reused by both jobs.
env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build:
    name: Build split APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # ABI splits keep each APK small instead of one fat APK.
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk     GymMane-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk   GymMane-armeabi-v7a.apk
          mv app-x86_64-release.apk        GymMane-x86_64.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gymmane-apks
          path: build/app/outputs/flutter-apk/GymMane-*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Publish for a manually dispatched release or whenever a release tag is pushed.
    # The release body is left empty on purpose so it can be filled in by hand.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')

    # Reproducible build: keep the pub cache at a fixed path inside the workspace
    # (/home/runner/work/GymMane/GymMane/.pub-cache). F-Droid relocates its build
    # to this exact same path and uses the same PUB_CACHE, so the embedded paths
    # match.
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Reproducibility: the jni package bakes a unique build-id into libdartjni.so.
      # Force --build-id=none so the native lib is deterministic. F-Droid applies
      # this exact same patch in its recipe.
      - name: Patch jni build-id
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$PUB_CACHE"/hosted/pub.dev/jni-*/src/CMakeLists.txt

      # Sign the release APKs with the release keystore (kept in GitHub Secrets)
      # so the published binaries match F-Droid's reproducible build.
      # If secrets are not yet configured (as was the case for the 0.1.1 tag),
      # generate a temporary release keystore so the build can still produce
      # a signed APK for the retry. This key is ephemeral and will be replaced
      # by a persistent one once secrets are configured (see warning below).
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          missing=""
          if [ -z "${KEYSTORE_BASE64:-}" ]; then missing="$missing KEYSTORE_BASE64"; fi
          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then missing="$missing KEYSTORE_PASSWORD"; fi
          if [ -z "${KEY_PASSWORD:-}" ]; then missing="$missing KEY_PASSWORD"; fi
          if [ -z "${KEY_ALIAS:-}" ]; then missing="$missing KEY_ALIAS"; fi
          if [ -n "$missing" ]; then
            echo "::warning::Missing signing secrets:$missing."
            echo "No persistent release keystore is configured. Generating a temporary"
            echo "release keystore for this run so the APK can be signed. This APK is"
            echo "signed (not debug) but the key is ephemeral: future updates will"
            echo "require the same keystore to be configured as repository secrets"
            echo "(KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS) to"
            echo "allow in-place updates. Users who install this APK will need to"
            echo "uninstall/reinstall if the keystore changes. To make releases"
            echo "reproducible and updatable, configure a persistent keystore and re-run."
            GEN_STOREPASS="GymManeTempStore123!"
            GEN_KEYPASS="GymManeTempKey123!"
            GEN_ALIAS="gymmane"
            echo "Generating temporary keystore at android/app/gymmane-release.jks..."
            keytool -genkeypair -keystore android/app/gymmane-release.jks \
              -alias "$GEN_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$GEN_STOREPASS" -keypass "$GEN_KEYPASS" \
              -dname "CN=GymMane CI, OU=GymMane, O=GymMane, L=Delft, ST=ZH, C=NL" \
              -storetype JKS
            if [ ! -s android/app/gymmane-release.jks ]; then
              echo "::error::Failed to generate temporary keystore"
              exit 1
            fi
            cat > android/key.properties <<EOF
          storePassword=$GEN_STOREPASS
          keyPassword=$GEN_KEYPASS
          keyAlias=$GEN_ALIAS
          storeFile=gymmane-release.jks
          EOF
            echo "Temporary signing files created:"
            ls -lh android/app/gymmane-release.jks android/key.properties
            echo "key.properties (passwords masked):"
            sed -E 's/(storePassword|keyPassword)=.*/\\1=***/' android/key.properties
            echo "::warning::Using ephemeral CI keystore for signing. See above for implications."
            exit 0
          fi
          # Decode keystore robustly (printf avoids trailing newline issues, --decode handles no-wrap).
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > android/app/gymmane-release.jks
          if [ ! -s android/app/gymmane-release.jks ]; then
            echo "::error::Decoded keystore is empty. Check that KEYSTORE_BASE64 is valid base64 of a .jks file."
            exit 1
          fi
          # Quick sanity check with keytool (without exposing passwords in logs).
          if ! keytool -list -keystore android/app/gymmane-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::warning::keytool could not list the keystore with the provided alias/password. The Gradle build will verify signing; this is just a pre-check."
            if ! keytool -list -keystore android/app/gymmane-release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              echo "::error::Keystore failed validation with keytool. Check KEYSTORE_PASSWORD and that KEYSTORE_BASE64 is correct."
            fi
          fi
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=gymmane-release.jks
          EOF
          if [ ! -s android/key.properties ]; then
            echo "::error::Failed to write android/key.properties"
            exit 1
          fi
          echo "Signing files created from secrets:"
          ls -lh android/app/gymmane-release.jks android/key.properties
          echo "key.properties (passwords masked):"
          sed -E 's/(storePassword|keyPassword)=.*/\\1=***/' android/key.properties

      # Reproducible build: version name AND code come entirely from pubspec.yaml
      # (1.0.0+1), exactly like F-Droid builds it. Do NOT pass --build-name or
      # --build-number here, or the APK won't match F-Droid's.
      # --split-debug-info moves the path-laden debug symbols out of libapp.so so
      # it builds deterministically. F-Droid uses the same flag.
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi --split-debug-info=build/symbols

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk     GymMane-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk   GymMane-armeabi-v7a.apk
          mv app-x86_64-release.apk        GymMane-x86_64.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: GymMane ${{ inputs.tag || github.ref_name }}
          files: |
            build/app/outputs/flutter-apk/GymMane-arm64-v8a.apk
            build/app/outputs/flutter-apk/GymMane-armeabi-v7a.apk
            build/app/outputs/flutter-apk/GymMane-x86_64.apk
